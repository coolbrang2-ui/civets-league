<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#800080">
  <title>Player Stats — Civitas League</title>
  <style>
    :root { color-scheme: light; --purple:#800080; --blue:#0648b8; --teal:#007b72; --gold:#ffd43b; --ink:#171322; --muted:#716b7c; --paper:#f4f1f6; --surface:#fff; --line:#e7dfeb; }
    [data-theme="dark"] { color-scheme: dark; --ink:#f2edf5; --muted:#b6aebe; --paper:#17131c; --surface:#211b27; --line:#39313f; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; background:var(--paper); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .shell { width:min(1120px,calc(100% - 48px)); margin-inline:auto; }
    .topbar { color:white; background:linear-gradient(118deg,var(--purple),#69008d 53%,var(--blue)); }
    .nav { min-height:76px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:inline-flex; align-items:center; gap:10px; font-size:14px; font-weight:850; letter-spacing:.04em; }
    .brand img { width:48px; height:48px; border-radius:50%; object-fit:cover; }
    .nav-actions { display:flex; align-items:center; gap:10px; }
    .nav-link,.theme-toggle { min-height:38px; display:inline-flex; align-items:center; justify-content:center; border:1px solid rgb(255 255 255 / 35%); border-radius:999px; background:rgb(255 255 255 / 9%); color:white; font:inherit; font-size:12px; font-weight:750; }
    .nav-link { padding:0 14px; }
    .theme-toggle { width:38px; cursor:pointer; }
    main { padding:38px 0 70px; }
    .profile-back { min-height:44px; display:inline-flex; align-items:center; gap:8px; margin-bottom:18px; padding:0 14px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font-size:13px; font-weight:800; }
    .profile-back:hover { border-color:var(--teal); color:var(--teal); }
    .profile-back:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
    .profile-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .profile-toolbar .profile-back { margin-bottom:0; }
    .rating-mode { min-height:44px; display:inline-flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .rating-mode button { min-height:34px; border:0; border-radius:5px; padding:0 12px; background:transparent; color:var(--muted); font:inherit; font-size:11px; font-weight:850; cursor:pointer; }
    .rating-mode button[aria-selected="true"] { background:var(--ink); color:var(--paper); box-shadow:0 4px 10px rgb(23 19 34 / 12%); }
    .rating-mode button:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
    .profile-grid { display:grid; grid-template-columns:minmax(280px,.8fr) minmax(0,1.6fr); gap:20px; align-items:start; }
    .season-card,.rating-card,.rates-card { border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .identity-card { min-width:0; perspective:1200px; }
    .player-card { min-height:560px; position:relative; overflow:hidden; border-radius:18px; border:2px solid #d6bd63; background:linear-gradient(145deg,#fff3a0 0%,#e4c65a 34%,#b58a32 100%); color:#171322; box-shadow:0 22px 46px rgb(23 19 34 / 24%); clip-path:polygon(8% 0,92% 0,100% 7%,100% 88%,92% 94%,92% 100%,8% 100%,8% 94%,0 88%,0 7%); transform:translateZ(0); }
    .player-card[data-tier="elite"] { border-color:#f6d970; background:linear-gradient(145deg,#fff08a 0%,#dcb64a 36%,#95651f 100%); box-shadow:0 24px 52px rgb(168 123 35 / 30%); }
    .player-card[data-tier="gold"] { border-color:#dbbf63; background:linear-gradient(145deg,#f5df8a 0%,#cbaa45 38%,#927027 100%); }
    .player-card[data-tier="silver"] { border-color:#d4dade; background:linear-gradient(145deg,#edf1f2 0%,#aeb7ba 42%,#687278 100%); }
    .player-card[data-photo-card="true"] { border-color:#d8d8d8; background:#fff; color:#171322; box-shadow:0 22px 48px rgb(23 19 34 / 18%); }
    .player-card[data-photo-card="true"]::before { background:linear-gradient(145deg,rgb(255 255 255 / 90%),rgb(255 255 255 / 65%)); }
    .player-card[data-photo-card="true"]::after { border-color:rgb(23 19 34 / 5%); box-shadow:0 0 0 38px rgb(23 19 34 / 2%),0 0 0 78px rgb(23 19 34 / 1%); }
    .player-card[data-photo-card="true"] .card-player-image { width:100%; height:286px; max-height:none; object-fit:contain; object-position:center center; filter:none; mix-blend-mode:multiply; background:white; }
    .player-card[data-photo-card="true"] .card-art { height:286px; margin:0 12px; border-bottom:1px solid #e6e6e6; overflow:hidden; background:white; }
    .player-card[data-photo-card="true"] .card-name { border-bottom-color:rgb(23 19 34 / 18%); }
    .player-card[data-photo-card="true"] .card-season { color:#777b80; }
    .player-card::before { position:absolute; inset:0; z-index:0; background-image:linear-gradient(118deg,transparent 0 18%,rgb(255 255 255 / 22%) 18% 24%,transparent 24% 54%,rgb(88 63 17 / 10%) 54% 57%,transparent 57%),radial-gradient(circle at 50% 110%,rgb(255 255 255 / 28%),transparent 42%),repeating-linear-gradient(82deg,rgb(255 255 255 / 3%) 0 2px,transparent 2px 8px); content:""; pointer-events:none; }
    .player-card::after { position:absolute; z-index:0; width:390px; height:390px; right:-214px; top:-220px; border:2px solid rgb(255 255 255 / 16%); border-radius:50%; box-shadow:0 0 0 38px rgb(255 255 255 / 4%),0 0 0 78px rgb(255 255 255 / 3%); content:""; pointer-events:none; }
    .card-rating { position:absolute; z-index:4; top:44px; left:34px; width:82px; text-align:center; }
    .card-rating strong { display:block; font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif; font-size:64px; line-height:.82; letter-spacing:-.02em; }
    .card-rating span { display:block; margin-top:8px; font-size:15px; font-weight:950; letter-spacing:.04em; text-transform:uppercase; }
    .card-club { position:absolute; z-index:4; top:136px; left:42px; width:66px; height:66px; object-fit:contain; filter:drop-shadow(0 5px 10px rgb(0 0 0 / 18%)); }
    .card-art { height:286px; position:relative; z-index:1; display:flex; align-items:flex-end; justify-content:center; padding-top:12px; }
    .card-player-image { width:215px; max-height:275px; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 18px 20px rgb(0 0 0 / 26%)); }
    .card-art-fallback { width:215px; height:auto; margin-bottom:-4px; object-fit:contain; filter:drop-shadow(0 14px 15px rgb(0 0 0 / 22%)); }
    .card-name { position:relative; z-index:3; margin:0 24px; padding:13px 8px 10px; border-bottom:2px solid rgb(23 19 34 / 32%); font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif; font-size:30px; line-height:1; text-align:center; text-transform:uppercase; }
    .card-season { position:relative; z-index:3; margin-top:7px; color:rgb(23 19 34 / 68%); font-size:9px; font-weight:950; letter-spacing:.16em; text-align:center; text-transform:uppercase; }
    .card-attributes { position:relative; z-index:3; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 18px; margin:12px 38px 20px; }
    .card-attribute { min-width:0; display:flex; align-items:baseline; justify-content:center; gap:7px; font-size:13px; font-weight:950; border-right:1px solid rgb(23 19 34 / 12%); }
    .card-attribute:nth-child(even) { border-right:0; }
    .card-attribute strong { font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif; font-size:20px; }
    .card-attribute span { font-size:12px; }
    .player-card.card-slide-out-left { animation:slideOutLeft .22s cubic-bezier(.4,0,.2,1) forwards; }
    .player-card.card-slide-out-right { animation:slideOutRight .22s cubic-bezier(.4,0,.2,1) forwards; }
    .player-card.card-slide-in-left { animation:slideInLeft .38s cubic-bezier(.16,1,.3,1) forwards; }
    .player-card.card-slide-in-right { animation:slideInRight .38s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes slideOutLeft { to { opacity:0; transform:translateX(-54px) rotateY(7deg) scale(.96); } }
    @keyframes slideOutRight { to { opacity:0; transform:translateX(54px) rotateY(-7deg) scale(.96); } }
    @keyframes slideInLeft { from { opacity:0; transform:translateX(54px) rotateY(-7deg) scale(.96); } to { opacity:1; transform:translateX(0) rotateY(0) scale(1); } }
    @keyframes slideInRight { from { opacity:0; transform:translateX(-54px) rotateY(7deg) scale(.96); } to { opacity:1; transform:translateX(0) rotateY(0) scale(1); } }
    .eyebrow { margin:0 0 7px; color:var(--teal); font-size:10px; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
    .right-column { display:grid; gap:20px; }
    .season-card { padding:22px; }
    .section-title { margin:0; font-size:18px; letter-spacing:-.025em; }
    .season-grid { display:grid; grid-template-columns:repeat(3,1fr); margin-top:18px; border:1px solid var(--line); border-radius:6px; }
    .season-stat { min-height:112px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-left:1px solid var(--line); text-align:center; }
    .season-stat:first-child { border-left:0; }
    .season-value { font-size:38px; line-height:1; font-weight:900; }
    .season-label { margin-top:9px; color:var(--muted); font-size:10px; font-weight:850; letter-spacing:.09em; text-transform:uppercase; }
    .rating-card,.rates-card { padding:22px; }
    .rating-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px 28px; margin-top:20px; }
    .rating-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; font-size:12px; font-weight:800; }
    .rating-head span:last-child { color:var(--purple); }
    [data-theme="dark"] .rating-head span:last-child { color:#e68be6; }
    .meter { height:8px; overflow:hidden; border-radius:999px; background:var(--line); }
    .meter-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--teal),#2bbf73 70%,var(--gold)); }
    .rate-list { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
    .rate { min-height:86px; display:flex; flex-direction:column; justify-content:center; padding:14px; border-left:3px solid var(--teal); border-radius:5px; background:var(--paper); }
    .rate strong { font-size:26px; }
    .rate span { margin-top:3px; color:var(--muted); font-size:10px; font-weight:850; letter-spacing:.06em; text-transform:uppercase; }
    .not-found { padding:50px 20px; border:1px solid var(--line); border-radius:8px; background:var(--surface); text-align:center; }
    .not-found a { display:inline-flex; min-height:44px; align-items:center; margin-top:18px; padding:0 16px; border-radius:6px; background:var(--teal); color:white; font-size:13px; font-weight:800; }
    @media (prefers-reduced-motion: reduce) { .player-card.card-slide-out-left,.player-card.card-slide-out-right,.player-card.card-slide-in-left,.player-card.card-slide-in-right { animation:none !important; } }
    @media (max-width:760px) { .shell { width:min(100% - 32px,1120px); } main { padding-top:22px; } .profile-grid { grid-template-columns:1fr; } .identity-card { width:min(360px,100%); margin-inline:auto; } .rate-list { grid-template-columns:1fr; } }
    @media (max-width:460px) { .brand span { display:none; } .nav-link { font-size:0; width:38px; padding:0; } .nav-link::before { font-size:16px; content:"←"; } .profile-toolbar { align-items:stretch; flex-direction:column-reverse; } .rating-mode { width:100%; } .rating-mode button { flex:1; } .player-card { min-height:540px; } .card-player-image,.card-art-fallback { width:205px; } .card-attributes { margin-inline:32px; } .rating-grid { grid-template-columns:1fr; } .season-grid { grid-template-columns:1fr; } .season-stat { min-height:86px; border-left:0; border-top:1px solid var(--line); } .season-stat:first-child { border-top:0; } }
  </style>
</head>
<body>
  <header class="topbar">
    <nav class="nav shell" aria-label="Main navigation">
      <a class="brand" href="index.html"><img src="assets/civitas-league-logo.png" alt=""><span>CIVITAS LEAGUE</span></a>
      <div class="nav-actions">
        <a class="nav-link" id="nav-back" href="players.html?team=un1ted">Back to UNIT1D</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">☾</button>
      </div>
    </nav>
  </header>
  <main class="shell">
    <div class="profile-toolbar">
      <a class="profile-back" id="profile-back" href="players.html?team=un1ted"><span aria-hidden="true">←</span> Back to UNIT1D</a>
      <div class="rating-mode" role="tablist" aria-label="Rating mode">
        <button id="season-mode" type="button" role="tab" aria-selected="true">Official Civitas Standards</button>
        <button id="fifa-mode" type="button" role="tab" aria-selected="false">FIFA standards</button>
      </div>
    </div>
    <div class="profile-grid" id="profile" hidden>
      <aside class="identity-card">
        <article class="player-card" id="player-card">
          <div class="card-rating"><strong id="player-ovr"></strong><span id="card-position"></span></div>
          <img class="card-club" id="card-club" src="assets/un1ted-crest-hd.png" alt="UNIT1D badge">
          <div class="card-art"><img class="card-art-fallback" id="card-art" src="assets/grey-male-template.svg" alt=""></div>
          <h1 class="card-name" id="player-name"></h1>
          <p class="card-season" id="card-season">UNIT1D · Season 4</p>
          <div class="card-attributes" id="card-attributes"></div>
        </article>
      </aside>
      <div class="right-column">
        <section class="season-card" aria-labelledby="season-heading">
          <h2 class="section-title" id="season-heading">Season 4 production</h2>
          <div class="season-grid">
            <div class="season-stat"><strong class="season-value" id="games"></strong><span class="season-label">Appearances</span></div>
            <div class="season-stat" id="secondary-season"><strong class="season-value" id="secondary-value"></strong><span class="season-label" id="secondary-label"></span></div>
            <div class="season-stat" id="assists-season"><strong class="season-value" id="assists"></strong><span class="season-label">Assists</span></div>
          </div>
        </section>
        <section class="rating-card" aria-labelledby="attributes-heading">
          <h2 class="section-title" id="attributes-heading">Player attributes</h2>
          <div class="rating-grid" id="rating-grid"></div>
        </section>
        <section class="rates-card" aria-labelledby="rates-heading">
          <h2 class="section-title" id="rates-heading">Match rates</h2>
          <div class="rate-list" id="rate-list"></div>
        </section>
      </div>
    </div>
    <div class="not-found" id="not-found" hidden><h1>Player not found</h1><p>This player profile is not available.</p><a href="index.html#clubs">Back to clubs</a></div>
  </main>
  <script>
    const players = {
      eijee:{name:"Eijee (Zuri)",position:"Midfielder/Defender",games:6,goals:3,assists:4,attributes:{Finishing:84,Pace:82,Passing:87,Defending:86,Dribbling:85,Physical:83},rates:{"Danger Rate":"8/10","Playmaking":"9/10","Consistency":"8/10"},ovr:85},
      robbie:{name:"Robbie",position:"Attacker",games:4,goals:5,assists:1,attributes:{Finishing:89,Pace:92,Passing:79,Dribbling:88,Physical:82,Positioning:90},rates:{"Danger Rate":"9/10","Goal Threat":"9/10","Finishing":"9/10"},ovr:88},
      adi:{name:"Adi (Hasnur)",position:"Attacker/Midfielder",games:6,goals:7,assists:2,attributes:{Finishing:92,Pace:91,Passing:84,Dribbling:90,Physical:84,Positioning:93},rates:{"Danger Rate":"10/10","Goal Threat":"10/10","Work Rate":"8/10"},ovr:91},
      hartley:{name:"Hartley (Laurentius)",position:"Attacker",games:6,goals:6,assists:5,attributes:{Finishing:90,Pace:88,Passing:89,Dribbling:87,Physical:84,Vision:92},rates:{"Danger Rate":"9/10","Playmaking":"9/10","Impact":"10/10"},ovr:90},
      heru:{name:"Heru (Hartono)",position:"Attacker",games:2,goals:2,assists:0,attributes:{Finishing:82,Pace:83,Passing:72,Dribbling:80,Physical:78,Positioning:81},rates:{"Danger Rate":"7/10","Goal Threat":"8/10","Impact":"7/10"},ovr:80},
      devan:{name:"Devan",position:"Defender",games:2,goals:0,assists:0,attributes:{Defending:80,Tackling:82,Pace:76,Passing:74,Physical:83,Positioning:81},rates:{"Defense Rate":"8/10","Physicality":"8/10","Risk":"2/10"},ovr:79},
      ganen:{name:"Ganen (Rasjidi)",position:"Midfielder",games:6,goals:2,assists:1,attributes:{Passing:84,Finishing:82,Pace:80,Dribbling:83,Physical:81,Vision:85},rates:{"Danger Rate":"7/10","Playmaking":"8/10","Consistency":"8/10"},ovr:83},
      davin:{name:"Davin",position:"Defender",games:0,goals:0,assists:0,attributes:{Defending:76,Tackling:78,Pace:75,Passing:72,Physical:80,Positioning:77},rates:{"Defense Rate":"7/10","Physicality":"8/10","Match Readiness":"0/10"},ovr:76},
      aesar:{name:"Aesar (Lunggana)",position:"Midfielder/Defender",games:4,goals:1,assists:2,attributes:{Passing:83,Defending:82,Tackling:81,Pace:78,Vision:84,Physical:80},rates:{"Defense Rate":"8/10","Playmaking":"8/10","Versatility":"9/10"},ovr:82},
      aqeel:{name:"Aqeel",position:"Attacker",games:2,goals:0,assists:0,attributes:{Finishing:75,Pace:80,Passing:70,Dribbling:78,Physical:74,Positioning:76},rates:{"Danger Rate":"5/10","Goal Threat":"5/10","Potential":"8/10"},ovr:76},
      herzian:{name:"Herzian",position:"Goalkeeper",games:0,saves:0,attributes:{Reflexes:76,Handling:74,Positioning:75,Kicking:72,Agility:75,Composure:74},rates:{"Shot Stopping":"7/10","Distribution":"7/10","Match Readiness":"0/10"},ovr:75},
      enzo:{name:"Enzo",position:"Goalkeeper",games:2,saves:4,attributes:{Reflexes:84,Handling:82,Positioning:83,Kicking:77,Agility:85,Composure:81},rates:{"Shot Stopping":"9/10","Save Rate":"8/10","Composure":"8/10"},ovr:83},
      gibral:{name:"Gibral",club:"Persihay",position:"Attacker",games:4,goals:9,assists:3,attributes:{Finishing:96,Pace:95,Passing:88,Dribbling:94,Physical:90,Positioning:96},rates:{"Danger Rate":"10/10","Goal Threat":"10/10","Impact":"10/10"},ovr:94}
    };

    const portraits = {
      eijee:"assets/un1ted-eljee-zuri.png",
      robbie:"assets/un1ted-robbie-owen-thomas.png",
      aesar:"assets/un1ted-aesar-lunggana.png",
      herzian:"assets/un1ted-herzian-prayata.png"
    };

    const slug = new URLSearchParams(window.location.search).get("player")?.toLowerCase();
    const player = players[slug];
    if (!player) { document.querySelector("#not-found").hidden = false; }
    else {
      document.title = `${player.name} Stats — Civitas League`;
      document.querySelector("#profile").hidden = false;
      const clubName = player.club || "UNIT1D";
      const clubSlug = clubName === "Persihay" ? "persihay" : "un1ted";
      const clubBadge = clubName === "Persihay" ? "assets/persihay-crest-hd.png" : "assets/un1ted-crest-hd.png";
      const backLabel = `Back to ${clubName}`;
      document.querySelector("#profile-back").href = `players.html?team=${clubSlug}`;
      document.querySelector("#profile-back").innerHTML = `<span aria-hidden="true">←</span> ${backLabel}`;
      document.querySelector("#nav-back").href = `players.html?team=${clubSlug}`;
      document.querySelector("#nav-back").textContent = backLabel;
      document.querySelector("#card-club").src = clubBadge;
      document.querySelector("#card-club").alt = `${clubName} badge`;
      document.querySelector("#card-season").textContent = `${clubName.toUpperCase()} · Season 4`;
      document.querySelector("#player-name").textContent = player.name;
      let ratingMode = "season";
      const seasonModeButton = document.querySelector("#season-mode");
      const fifaModeButton = document.querySelector("#fifa-mode");
      const cardPosition = player.position === "Goalkeeper" ? "GK" : player.position === "Attacker" ? "ST" : player.position === "Defender" ? "CB" : player.position.includes("Midfielder") ? "CM" : "U";
      document.querySelector("#card-position").textContent = cardPosition;
      const playerCard = document.querySelector("#player-card");
      const cardArt = document.querySelector("#card-art");
      const photoCardSlugs = new Set(["robbie", "herzian", "aesar", "eijee"]);
      playerCard.dataset.photoCard = String(photoCardSlugs.has(slug));
      if (portraits[slug]) {
        cardArt.src = portraits[slug];
        cardArt.className = "card-player-image";
      } else {
        cardArt.src = "assets/grey-male-template.svg";
        cardArt.className = "card-art-fallback";
      }
      cardArt.alt = portraits[slug] ? `${player.name} portrait` : `${player.name} grey player template`;
      document.querySelector("#games").textContent = player.games;
      const cardAttributes = document.querySelector("#card-attributes");

      function getDisplayRatings(mode) {
        if (mode === "season") {
          return { ovr: player.ovr, attributes: { ...player.attributes }, rates: { ...player.rates } };
        }
        const production = player.position === "Goalkeeper"
          ? (player.saves || 0) * 1.2 + player.games * 0.6
          : (player.goals || 0) * 1.25 + (player.assists || 0) * 0.85 + player.games * 0.5;
        const fifaOvr = Math.min(40, Math.max(30, Math.round(30 + production * 0.55)));
        const attributes = {};
        Object.entries(player.attributes).forEach(([label,value]) => {
          const experienceBonus = player.games === 0 ? -1 : Math.min(1, player.games / 6);
          const attributeValue = Math.round(30 + (value - 70) * 0.42 + experienceBonus + (fifaOvr - 35) * 0.12);
          attributes[label] = Math.min(40, Math.max(30, attributeValue));
        });
        const rates = {};
        Object.entries(player.rates).forEach(([label,value], index) => {
          const numeric = Number.parseInt(value, 10);
          const professionalRate = player.games === 0 ? 3 : index === 0 ? 4 : 5;
          const adjustedRate = Math.round((professionalRate + numeric) / 2);
          rates[label] = `${Math.min(10, Math.max(3, adjustedRate))}/10`;
        });
        return { ovr: fifaOvr, attributes, rates };
      }

      let isCardAnimating = false;
      let cardAnimationTimer = null;

      function applyRatings(mode) {
        const display = getDisplayRatings(mode);
        document.querySelector("#player-ovr").textContent = display.ovr;
        const tier = display.ovr >= 90 ? "elite" : display.ovr >= 85 ? "gold" : "silver";
        playerCard.dataset.tier = tier;
        document.querySelector("#card-season").textContent = `${clubName.toUpperCase()} · ${mode === "fifa" ? "FIFA Standards" : "Official Civitas Standards"}`;
        seasonModeButton.setAttribute("aria-selected", String(mode === "season"));
        fifaModeButton.setAttribute("aria-selected", String(mode === "fifa"));

        cardAttributes.replaceChildren();
        const ratingGrid = document.querySelector("#rating-grid");
        ratingGrid.replaceChildren();
        for (const [label,value] of Object.entries(display.attributes)) {
          const abbreviation = label.slice(0,3).toUpperCase();
          const item = document.createElement("div");
          item.className = "card-attribute";
          item.innerHTML = `<strong>${value}</strong><span>${abbreviation}</span>`;
          cardAttributes.append(item);

          const detail = document.createElement("div");
          detail.innerHTML = `<div class="rating-head"><span>${label}</span><span>${value}</span></div><div class="meter"><div class="meter-fill" style="width:${value}%"></div></div>`;
          ratingGrid.append(detail);
        }

        const rateList = document.querySelector("#rate-list");
        rateList.replaceChildren();
        for (const [label,value] of Object.entries(display.rates)) {
          const item = document.createElement("div");
          item.className = "rate";
          item.innerHTML = `<strong>${value}</strong><span>${label}</span>`;
          rateList.append(item);
        }
      }

      function renderRatings(mode) {
        if (mode === ratingMode || isCardAnimating) return;
        ratingMode = mode;
        const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (prefersReducedMotion) {
          applyRatings(mode);
          return;
        }

        isCardAnimating = true;
        const directionOut = mode === "fifa" ? "card-slide-out-left" : "card-slide-out-right";
        const directionIn = mode === "fifa" ? "card-slide-in-left" : "card-slide-in-right";
        playerCard.classList.remove("card-slide-in-left", "card-slide-in-right", "card-slide-out-left", "card-slide-out-right");
        playerCard.classList.add(directionOut);

        window.clearTimeout(cardAnimationTimer);
        cardAnimationTimer = window.setTimeout(() => {
          applyRatings(mode);
          playerCard.classList.remove(directionOut);
          playerCard.classList.add(directionIn);
          cardAnimationTimer = window.setTimeout(() => {
            playerCard.classList.remove(directionIn);
            isCardAnimating = false;
          }, 380);
        }, 220);
      }

      seasonModeButton.addEventListener("click", () => renderRatings("season"));
      fifaModeButton.addEventListener("click", () => renderRatings("fifa"));
      applyRatings("season");

      const goalkeeper = player.position === "Goalkeeper";
      document.querySelector("#secondary-label").textContent = goalkeeper ? "Saves" : "Goals";
      document.querySelector("#secondary-value").textContent = goalkeeper ? player.saves : player.goals;
      document.querySelector("#assists-season").hidden = goalkeeper;
      if (!goalkeeper) document.querySelector("#assists").textContent = player.assists;

    }

    const themeButton = document.querySelector("#theme-toggle");
    const savedTheme = localStorage.getItem("civitas-theme");
    const initialTheme = savedTheme === "light" ? "light" : "dark";
    document.documentElement.dataset.theme = initialTheme;
    themeButton.textContent = initialTheme === "dark" ? "☀" : "☾";
    themeButton.setAttribute("aria-label", `Switch to ${initialTheme === "dark" ? "light" : "dark"} theme`);
    themeButton.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("civitas-theme", next);
      themeButton.textContent = next === "dark" ? "☀" : "☾";
    });
  </script>
</body>
</html>
